name: Nightly build

# Runs once a day, only if main changed in the last 26 hours (D012); otherwise it
# repeats the previous result so the README badge reflects the real state of main.
# Also refreshes the build cache on main, which pull requests restore from.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-build
  cancel-in-progress: false

env:
  COMPARE: 0
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1
  GAME_VERSION: EMERALD

jobs:
  nightly:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Did main change today?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: nightly-build.yml
        run: .github/ci/nightly-gate.sh
      - id: setup
        if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/setup
        with:
          cache-family: rom
      - name: Nightly build
        if: steps.gate.outputs.run == 'true'
        run: |
          make -j$(nproc) -O all
          make -j$(nproc) -O release
      - name: Release excludes the Battle Lab
        if: steps.gate.outputs.run == 'true'
        run: |
          if arm-none-eabi-nm pokeemerald-release.elf | grep -iE 'BattleLab|sLabTrainers|Ascension_C'; then
            echo "::error::Battle Lab or dev-checkpoint code found in the release build"; exit 1
          fi
          if grep -c ASCENSION-LAB-01 pokeemerald-release.gba; then
            echo "::error::Battle Lab scenario block found in the release ROM"; exit 1
          fi
          arm-none-eabi-nm pokeemerald.elf | grep -q BattleLab_Open || { echo "::error::Battle Lab missing from the dev build"; exit 1; }
      - name: Pack build cache
        if: steps.gate.outputs.run == 'true'
        run: .github/ci/save-build-cache.sh ~/build-cache.tar
      - uses: actions/cache/save@v4
        if: steps.gate.outputs.run == 'true'
        with:
          path: ~/build-cache.tar
          key: ${{ steps.setup.outputs.cache-key }}
