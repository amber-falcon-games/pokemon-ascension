name: CI

# Pull requests only (D012). main is covered by the nightly workflows.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPARE: 0
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1
  GAME_VERSION: EMERALD

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      tests: ${{ steps.classify.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - name: Classify changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename' > changed.txt
          else
            echo "manual" > changed.txt   # manual run: treated as a full run
          fi
          .github/ci/classify-changes.sh changed.txt

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check docs/SUMMARY.md lists every doc
        run: .github/docs_validate/inclusive_summary.py
      - name: Project tool tests (patch tool)
        run: python3 -I test/ascension/test_bps.py

  build:
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/setup
        with:
          cache-family: rom
      - name: Build ROM
        run: make -j$(nproc) -O all
      - name: Report size
        run: |
          echo '### ROM build' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          arm-none-eabi-size pokeemerald.elf | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Pack build cache
        run: .github/ci/save-build-cache.sh ~/build-cache.tar
      - uses: actions/cache/save@v4
        with:
          path: ~/build-cache.tar
          key: ${{ steps.setup.outputs.cache-key }}

  test:
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/setup
        with:
          cache-family: test
      - name: Run test shard ${{ matrix.shard }} of 4
        env:
          TEST_SHARD_COUNT: 4
          TEST_SHARD_INDEX: ${{ matrix.shard }}
        run: make -j$(nproc) check
      - name: Pack build cache
        if: matrix.shard == 0
        run: .github/ci/save-build-cache.sh ~/build-cache.tar
      - uses: actions/cache/save@v4
        if: matrix.shard == 0
        with:
          path: ~/build-cache.tar
          key: ${{ steps.setup.outputs.cache-key }}

  test-changed:
    needs: changes
    if: needs.changes.outputs.mode == 'tests'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-family: test
      - name: Run only the changed test files
        run: |
          for f in ${{ needs.changes.outputs.tests }}; do
            echo "::group::$f"
            rm -f pokeemerald-test.elf   # the file filter is written into the test image when it is linked
            make -j$(nproc) check TESTS="$f"
            echo "::endgroup::"
          done

  # One status to require in branch protection.
  ci-ok:
    if: always()
    needs: [changes, docs, build, test, test-changed]
    runs-on: ubuntu-24.04
    steps:
      - name: All required jobs passed or were not needed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 -c "import json,os,sys; n=json.loads(os.environ['NEEDS']); bad={k:v['result'] for k,v in n.items() if v['result'] not in ('success','skipped')}; print(bad or 'all ok'); sys.exit(1 if bad else 0)"
